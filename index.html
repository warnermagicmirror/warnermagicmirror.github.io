<!DOCTYPE html>
<html lang="en">
<head>
 <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=laundry" />
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Warner MagicMirror</title>
 
<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background: linear-gradient(135deg, #0f172a, #111827, #1e293b);
    color: white;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
}

.container {
    width: 100%;
    max-width: 900px;
}

.card {
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.12);
    backdrop-filter: blur(10px);
    border-radius: 22px;
    padding: 35px;
    box-shadow: 0 20px 45px rgba(0,0,0,0.35);
}

h1 {
    margin: 0;
    font-size: 42px;
    text-align: center;
}

.subtitle {
    text-align: center;
    color: rgba(255,255,255,0.75);
    margin-top: 10px;
    margin-bottom: 30px;
    font-size: 18px;
}

.grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
    gap: 18px;
}

.tile {
    display: block;
    text-decoration: none;
    color: white;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 18px;
    padding: 22px;
    transition: 0.2s;
}

.tile:hover {
    transform: translateY(-4px);
    background: rgba(255,255,255,0.11);
}

.icon {
    font-size: 34px;
    margin-bottom: 12px;
    font-family: material-symbols-outlined;
 
}

.title {
    font-size: 22px;
    font-weight: bold;
    margin-bottom: 6px;
}

.desc {
    color: rgba(255,255,255,0.72);
    font-size: 15px;
    line-height: 1.45;
}

.footer {
    text-align: center;
    margin-top: 26px;
    color: rgba(255,255,255,0.55);
    font-size: 14px;
}
</style>
</head>

<body>
<div class="container">
    <div class="card">
        <h1>Warner MagicMirror</h1>
        <div class="subtitle">Smart dashboard launcher</div>

        <div class="grid">

            <a class="tile" href="/laundry-schedule/">
                <div class="icon">🧺</div>
                <div class="title">Laundry Schedule</div>
                <div class="desc">
                    View whose turn it is, run timers, and hear alerts when finished.
                </div>
            </a>

        </div>

        <div class="footer">
            Powered by GitHub Pages
        </div>
    </div>
</div>
</body>
</html>
