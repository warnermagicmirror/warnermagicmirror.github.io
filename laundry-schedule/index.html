<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=alarm" />
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Laundry Schedule</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background: linear-gradient(135deg, #eef4ff, #f8fbff);
    color: #1f2937;
    padding: 30px 15px;
}

.container {
    max-width: 850px;
    margin: auto;
}

.card {
    background: white;
    border-radius: 18px;
    box-shadow: 0 12px 30px rgba(0,0,0,0.08);
    padding: 25px;
    margin-bottom: 20px;
}

h1 {
    margin: 0 0 18px 0;
    font-size: 32px;
    text-align: center;
}

.sub {
    color: #6b7280;
    text-align: center;
    margin-bottom: 22px;
}

#onlaundry {
    font-size: 24px;
    font-weight: bold;
    background: #f3f7ff;
    border: 1px solid #dbe8ff;
    border-radius: 14px;
    padding: 18px;
    text-align: center;
}

.controls {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    margin-top: 18px;
}

input[type="number"] {
    flex: 1;
    min-width: 180px;
    border: 1px solid #d1d5db;
    border-radius: 12px;
    padding: 14px;
    font-size: 16px;
    outline: none;
}

input[type="number"]:focus {
    border-color: #3b82f6;
    box-shadow: 0 0 0 4px rgba(59,130,246,0.12);
}

button {
    border: none;
    border-radius: 12px;
    padding: 14px 18px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    transition: 0.18s;
}

button:hover {
    transform: translateY(-1px);
}

.primary-btn {
    background: #2563eb;
    color: white;
}

.primary-btn:hover {
    background: #1d4ed8;
}

.dismiss-btn {
    background: #10b981;
    color: white;
    margin-top: 12px;
}

.dismiss-btn:hover {
    background: #059669;
}

.section-title {
    font-size: 22px;
    margin: 0 0 14px 0;
}

#timers {
    display: flex;
    flex-direction: column;
    gap: 12px;
}

.timer-item {
    display: flex;
    align-items: center;
    gap: 12px;
    background: #f9fafb;
    border: 1px solid #e5e7eb;
    border-radius: 14px;
    padding: 14px;
}

.delete-btn {
    width: 34px;
    height: 34px;
    border-radius: 50%;
    padding: 0;
    font-size: 18px;
    font-weight: bold;
    background: #ef4444;
    color: white;
    flex-shrink: 0;
}

.delete-btn:hover {
    background: #dc2626;
}

.timer-main {
    flex: 1;
}

.timer-name {
    font-weight: bold;
    font-size: 17px;
    margin-bottom: 4px;
}

.timer-left {
    color: #6b7280;
    font-size: 14px;
}

.empty {
    color: #6b7280;
    padding: 14px;
    text-align: center;
    border: 2px dashed #d1d5db;
    border-radius: 14px;
    background: #fafafa;
}

.overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.45);
    display: none;
    align-items: center;
    justify-content: center;
    padding: 20px;
}

.modal {
    background: white;
    width: 100%;
    max-width: 420px;
    border-radius: 18px;
    padding: 24px;
    box-shadow: 0 20px 40px rgba(0,0,0,0.2);
}

.modal h2 {
    margin-top: 0;
}

.modal-buttons {
    display: flex;
    gap: 10px;
    justify-content: flex-end;
    margin-top: 18px;
}

.secondary-btn {
    background: #e5e7eb;
    color: #111827;
}

.danger-btn {
    background: #ef4444;
    color: white;
}

.alert-title {
    font-size: 28px;
    color: #ef4444;
    margin-bottom: 10px;
}
</style>
</head>

<body>
<div class="container">

    <div class="card">
        <h1>Laundry Schedule</h1>
        <div class="sub">Current laundry turn + personal timers</div>
        <div id="onlaundry"></div>

        <div class="controls">
            <input id="minutesInput" type="number" min="1" placeholder="Minutes">
            <button class="primary-btn" id="addTimerBtn">+ Add Timer</button>
        </div>
    </div>

    <div class="card">
        <div class="section-title">Current Timers</div>
        <div id="timers"></div>
    </div>

</div>

<audio id="alarmSound" src="timer-completed.mp3"></audio>

<div class="overlay" id="deleteOverlay">
    <div class="modal">
        <h2>Delete Timer?</h2>
        <div>Are you sure you want to delete this timer?</div>
        <div class="modal-buttons">
            <button class="secondary-btn" id="cancelDelete">Cancel</button>
            <button class="danger-btn" id="confirmDelete">Delete</button>
        </div>
    </div>
</div>

<div class="overlay" id="doneOverlay">
    <div class="modal">
        <div class="alert-title"><span class="material-symbols-outlined">alarm</span> Timer Complete</div>
        <div id="doneText"></div>
        <button class="dismiss-btn" id="dismissDone">Dismiss</button>
    </div>
</div>

<script>
var f = "Father";
var mo = "Mother";
var s = "Shalyn";
var l = "Lamoni";
var ja = "Jason";
var je = "Jedediah";
var ma = "Marianne";
var _ = "****";

var schedule = {
    mon: [mo, mo, mo, je + " & " + ma],
    tue: [s, ma, ma, ja],
    wed: [s, je, je, l],
    thu: [s, mo, mo, ja],
    fri: [s, je, ma, l],
    sat: [ja, ja, l, l],
    sun: [_, _, _, _]
};

var timers = [];
var nextId = 1;
var deleteId = null;
var completedId = null;

function drawLaundry() {
    var date = new Date();
    var string = date.toString().toLowerCase();
    var day = schedule[string[0] + string[1] + string[2]];
    var hour = date.getHours();

    var onLaundry = "";
    var until = "";

    var slots = [
        { start: 5, end: 10, label: "10:00 AM" },
        { start: 10, end: 14, label: "2:00 PM" },
        { start: 14, end: 18, label: "6:00 PM" },
        { start: 18, end: 22, label: "10:00 PM" }
    ];

    var index = -1;

    for (var i = 0; i < slots.length; i++) {
        if (hour >= slots[i].start && hour < slots[i].end) {
            index = i;
            break;
        }
    }

    if (index === -1) {
        onLaundry = _;
        until = "5:00 AM";
    } else {
        onLaundry = day[index];

        // 🔥 FIX: extend forward across same person
        var endIndex = index;

        for (var j = index + 1; j < day.length; j++) {
            if (day[j] === onLaundry) {
                endIndex = j;
            } else {
                break;
            }
        }

        until = slots[endIndex].label;
    }

    document.getElementById("onlaundry").textContent =
        onLaundry + " is currently on laundry until " + until + ".";
}

function addTimer(minutes) {
    timers.push({
        id: nextId++,
        minutes: minutes,
        end: Date.now() + minutes * 60000,
        completed: false
    });

    renderTimers();
}

function formatTime(ms) {
    var total = Math.ceil(ms / 1000);
    if (total < 0) {
        total = 0;
    }

    var mins = Math.floor(total / 60);
    var secs = total % 60;

    return mins + "m " + (secs < 10 ? "0" : "") + secs + "s";
}

function renderTimers() {
    var box = document.getElementById("timers");
    box.innerHTML = "";

    if (timers.length === 0) {
        box.innerHTML = '<div class="empty">No active timers.</div>';
        return;
    }

    for (var i = 0; i < timers.length; i++) {
        var t = timers[i];
        var left = t.end - Date.now();

        var item = document.createElement("div");
        item.className = "timer-item";

        var del = document.createElement("button");
        del.className = "delete-btn";
        del.textContent = "✕";
        del.dataset.id = t.id;

        del.onclick = function() {
            deleteId = Number(this.dataset.id);
            document.getElementById("deleteOverlay").style.display = "flex";
        };

        var main = document.createElement("div");
        main.className = "timer-main";

        var name = document.createElement("div");
        name.className = "timer-name";
        name.textContent = t.minutes + " Minute Timer";

        var time = document.createElement("div");
        time.className = "timer-left";
        time.textContent = left > 0 ? "Time Left: " + formatTime(left) : "Finishing...";

        main.appendChild(name);
        main.appendChild(time);

        item.appendChild(del);
        item.appendChild(main);
        box.appendChild(item);
    }
}

function removeTimer(id) {
    for (var i = 0; i < timers.length; i++) {
        if (timers[i].id === id) {
            timers.splice(i, 1);
            break;
        }
    }
    renderTimers();
}

function checkTimers() {
    for (var i = 0; i < timers.length; i++) {
        var t = timers[i];

        if (!t.completed && Date.now() >= t.end) {
            t.completed = true;
            completedId = t.id;

            var audio = document.getElementById("alarmSound");
            audio.currentTime = 0;
            audio.play();

            document.getElementById("doneText").textContent =
                t.minutes + " minute timer has completed.";
            document.getElementById("doneOverlay").style.display = "flex";

            audio.onended = function() {
                // 🔥 IF USER DIDN'T DISMISS → SNOOZE
                if (completedId !== null) {
                    for (var j = 0; j < timers.length; j++) {
                        if (timers[j].id === completedId) {
                            timers[j].completed = false;
                            timers[j].end = Date.now() + 2 * 60000; // 2 min snooze
                            break;
                        }
                    }

                    completedId = null;
                    document.getElementById("doneOverlay").style.display = "none";
                    renderTimers();
                }
            };

            break;
        }
    }

    renderTimers();
}

document.getElementById("addTimerBtn").onclick = function() {
    var input = document.getElementById("minutesInput");
    var minutes = Number(input.value);

    if (minutes > 0) {
        addTimer(minutes);
        input.value = "";
        input.focus();
    } else {
        alert("Please enter a valid time!");
    }
};

document.getElementById("minutesInput").onkeydown = function(e) {
    if (e.key === "Enter") {
        document.getElementById("addTimerBtn").click();
    }
};

document.getElementById("cancelDelete").onclick = function() {
    deleteId = null;
    document.getElementById("deleteOverlay").style.display = "none";
};

document.getElementById("confirmDelete").onclick = function() {
    if (deleteId !== null) {
        removeTimer(deleteId);
    }
    deleteId = null;
    document.getElementById("deleteOverlay").style.display = "none";
};

document.getElementById("dismissDone").onclick = function() {
    var audio = document.getElementById("alarmSound");
    audio.pause();
    audio.currentTime = 0;

    if (completedId !== null) {
        removeTimer(completedId);
        completedId = null;
    }

    document.getElementById("doneOverlay").style.display = "none";
};

drawLaundry();
renderTimers();

setInterval(drawLaundry, 10000);
setInterval(checkTimers, 250);
</script>
</body>
</html>
