<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Laundry Schedule</title>

<style>
* { box-sizing: border-box; }

body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background: linear-gradient(135deg, #eef4ff, #f8fbff);
    color: #1f2937;
    padding: 30px 15px;
}

.container { max-width: 850px; margin: auto; }

.card {
    background: white;
    border-radius: 18px;
    box-shadow: 0 12px 30px rgba(0,0,0,0.08);
    padding: 25px;
    margin-bottom: 20px;
}

h1 { text-align: center; }

.controls {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    margin-top: 18px;
}

input, select {
    padding: 14px;
    border-radius: 12px;
    border: 1px solid #d1d5db;
    font-size: 16px;
}

button {
    border: none;
    border-radius: 12px;
    padding: 14px;
    font-weight: bold;
    cursor: pointer;
}

.primary-btn { background: #2563eb; color: white; }

.timer-item {
    display: flex;
    align-items: center;
    gap: 12px;
    background: #f9fafb;
    border: 1px solid #e5e7eb;
    border-radius: 14px;
    padding: 14px;
}

.delete-btn {
    width: 34px;
    height: 34px;
    border-radius: 50%;
    background: #ef4444;
    color: white;
    font-size: 18px;
}

.overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.45);
    display: none;
    align-items: center;
    justify-content: center;
}

.modal {
    background: white;
    padding: 24px;
    border-radius: 18px;
    text-align: center;
}
</style>
</head>

<body>
<div class="container">

<div class="card">
<h1>Laundry Schedule</h1>
<div id="onlaundry"></div>

<div class="controls">
<input id="minutesInput" type="number" min="1" placeholder="Minutes">
<select id="soundSelect"></select>
<button class="primary-btn" id="addTimerBtn">+ Add Timer</button>
</div>
</div>

<div class="card">
<h2>Current Timers</h2>
<div id="timers"></div>
</div>

</div>

<audio id="alarmSound"></audio>
<audio id="previewAudio"></audio>

<!-- Preview Modal -->
<div class="overlay" id="previewOverlay">
<div class="modal">
<h2>Preview Sound</h2>
<div id="previewName"></div>
<br>
<button id="stopPreview">Stop</button>
</div>
</div>

<!-- Done Modal -->
<div class="overlay" id="doneOverlay">
<div class="modal">
<h2>Timer Complete</h2>
<div id="doneText"></div>
<br>
<button id="dismissDone">Dismiss</button>
</div>
</div>

<script>
/* ------------------ SOUNDS ------------------ */
var sounds = [
    { name: "Default", file: "timer-completed.mp3" }
];

var selectedSound = sounds[0];

function loadSounds() {
    var select = document.getElementById("soundSelect");

    sounds.forEach((s, i) => {
        var opt = document.createElement("option");
        opt.value = i;
        opt.textContent = s.name;
        select.appendChild(opt);
    });

    select.onchange = function () {
        selectedSound = sounds[this.value];
        previewSound(selectedSound);
    };
}

function previewSound(sound) {
    var audio = document.getElementById("previewAudio");
    audio.src = sound.file;
    audio.currentTime = 0;
    audio.play();

    document.getElementById("previewName").textContent = sound.name;
    document.getElementById("previewOverlay").style.display = "flex";

    audio.onended = closePreview;
}

function closePreview() {
    var audio = document.getElementById("previewAudio");
    audio.pause();
    audio.currentTime = 0;
    document.getElementById("previewOverlay").style.display = "none";
}

document.getElementById("stopPreview").onclick = closePreview;

/* ------------------ TIMERS ------------------ */
var timers = [];
var nextId = 1;

function saveTimers() {
    localStorage.setItem("timers", JSON.stringify(timers));
}

function loadTimers() {
    var saved = localStorage.getItem("timers");
    if (saved) {
        timers = JSON.parse(saved);

        timers.forEach(t => {
            var found = sounds.find(s => s.file === t.sound.file);
            if (found) t.sound = found;
        });

        nextId = timers.length ? Math.max(...timers.map(t => t.id)) + 1 : 1;
    }
}

function addTimer(minutes) {
    timers.push({
        id: nextId++,
        minutes: minutes,
        end: Date.now() + minutes * 60000,
        completed: false,
        sound: selectedSound
    });

    saveTimers();
    renderTimers();
}

function removeTimer(id) {
    timers = timers.filter(t => t.id !== id);
    saveTimers();
    renderTimers();
}

function formatTime(ms) {
    var total = Math.ceil(ms / 1000);
    var m = Math.floor(total / 60);
    var s = total % 60;
    return m + "m " + (s < 10 ? "0" : "") + s + "s";
}

function renderTimers() {
    var box = document.getElementById("timers");
    box.innerHTML = "";

    if (!timers.length) {
        box.innerHTML = "No timers.";
        return;
    }

    timers.forEach(t => {
        var div = document.createElement("div");
        div.className = "timer-item";

        var del = document.createElement("button");
        del.className = "delete-btn";
        del.textContent = "✕";
        del.onclick = () => removeTimer(t.id);

        var text = document.createElement("div");
        var left = t.end - Date.now();

        text.innerHTML =
            "<b>" + t.minutes + " min (" + t.sound.name + ")</b><br>" +
            (left > 0 ? formatTime(left) : "Finishing...");

        div.appendChild(del);
        div.appendChild(text);
        box.appendChild(div);
    });
}

function checkTimers() {
    timers.forEach(t => {
        if (!t.completed && Date.now() >= t.end) {
            t.completed = true;

            var audio = document.getElementById("alarmSound");
            audio.src = t.sound.file;
            audio.currentTime = 0;
            audio.play();

            document.getElementById("doneText").textContent =
                t.minutes + " minute timer done!";
            document.getElementById("doneOverlay").style.display = "flex";

            removeTimer(t.id);
        }
    });

    renderTimers();
}

/* ------------------ EVENTS ------------------ */
document.getElementById("addTimerBtn").onclick = function() {
    var val = Number(document.getElementById("minutesInput").value);
    if (val > 0) {
        addTimer(val);
        document.getElementById("minutesInput").value = "";
    } else {
        alert("Enter a valid time");
    }
};

document.getElementById("dismissDone").onclick = function() {
    document.getElementById("doneOverlay").style.display = "none";
};

/* ------------------ INIT ------------------ */
loadSounds();
loadTimers();
renderTimers();
setInterval(checkTimers, 500);
</script>

</body>
</html>
