<!DOCTYPE html>
<html lang="en">
<head>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" />
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Laundry Schedule</title>

<style>
* { box-sizing: border-box; }

body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background: linear-gradient(135deg, #eef4ff, #f8fbff);
    color: #1f2937;
    padding: 30px 15px;
}

.container { max-width: 850px; margin: auto; }

.card {
    background: white;
    border-radius: 18px;
    box-shadow: 0 12px 30px rgba(0,0,0,0.08);
    padding: 25px;
    margin-bottom: 20px;
}

h1 {
    margin: 0 0 18px 0;
    font-size: 32px;
    text-align: center;
}

.sub {
    color: #6b7280;
    text-align: center;
    margin-bottom: 22px;
}

#onlaundry {
    font-size: 24px;
    font-weight: bold;
    background: #f3f7ff;
    border: 1px solid #dbe8ff;
    border-radius: 14px;
    padding: 18px;
    text-align: center;
}

.controls {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    margin-top: 18px;
}

input[type="number"], select {
    flex: 1;
    min-width: 180px;
    border: 1px solid #d1d5db;
    border-radius: 12px;
    padding: 14px;
    font-size: 16px;
    outline: none;
}

input:focus, select:focus {
    border-color: #3b82f6;
    box-shadow: 0 0 0 4px rgba(59,130,246,0.12);
}

button {
    border: none;
    border-radius: 12px;
    padding: 14px 18px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    transition: 0.18s;
}

button:hover { transform: translateY(-1px); }

.primary-btn { background: #2563eb; color: white; }
.primary-btn:hover { background: #1d4ed8; }

.dismiss-btn {
    background: #10b981;
    color: white;
    margin-top: 12px;
}

.section-title { font-size: 22px; margin-bottom: 14px; }

#timers {
    display: flex;
    flex-direction: column;
    gap: 12px;
}

.timer-item {
    display: flex;
    align-items: center;
    gap: 12px;
    background: #f9fafb;
    border: 1px solid #e5e7eb;
    border-radius: 14px;
    padding: 14px;
}

.delete-btn {
    width: 34px;
    height: 34px;
    border-radius: 50%;
    padding: 0;
    font-size: 22px;
    font-weight: bold;
    background: #ef4444;
    color: white;
    flex-shrink: 0;
}

.timer-main { flex: 1; }
.timer-name { font-weight: bold; font-size: 17px; }
.timer-left { color: #6b7280; font-size: 14px; }

.empty {
    text-align: center;
    padding: 14px;
    border: 2px dashed #d1d5db;
    border-radius: 14px;
}

.overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.45);
    display: none;
    align-items: center;
    justify-content: center;
}

.modal {
    background: white;
    width: 100%;
    max-width: 420px;
    border-radius: 18px;
    padding: 24px;
}
</style>
</head>

<body>
<div class="container">

<div class="card">
<h1>Laundry Schedule</h1>
<div class="sub">Current laundry turn + personal timers</div>
<div id="onlaundry"></div>

<div class="controls">
<input id="minutesInput" type="number" min="1" placeholder="Minutes">
<select id="soundSelect"></select>
<button class="primary-btn" id="addTimerBtn">+ Add Timer</button>
</div>
</div>

<div class="card">
<div class="section-title">Current Timers</div>
<div id="timers"></div>
</div>

</div>

<audio id="alarmSound"></audio>
<audio id="previewAudio"></audio>
<audio id="turnSound" src="notification.mp3"></audio>

<!-- Preview -->
<div class="overlay" id="previewOverlay">
<div class="modal">
<h2>Preview Sound</h2>
<div id="previewName"></div>
<button id="stopPreview">Stop</button>
</div>
</div>

<!-- Delete -->
<div class="overlay" id="deleteOverlay">
<div class="modal">
<h2>Delete Timer?</h2>
<button id="cancelDelete">Cancel</button>
<button id="confirmDelete">Delete</button>
</div>
</div>

<!-- Done -->
<div class="overlay" id="doneOverlay">
<div class="modal">
<h2>Timer Complete</h2>
<div id="doneText"></div>
<button class="dismiss-btn" id="dismissDone">Dismiss</button>
</div>
</div>

<script>
/* ---------- SOUNDS ---------- */
var sounds = [
    { name: "Default", file: "timer-completed.mp3" },
    { name: "Consequences", file: "consequences.mp3" }
];
var selectedSound = sounds[0];

var select = document.getElementById("soundSelect");
sounds.forEach((s,i)=>{
    var opt=document.createElement("option");
    opt.value=i;
    opt.textContent=s.name;
    select.appendChild(opt);
});

select.onchange=function(){
    selectedSound = sounds[this.value];
    previewSound(selectedSound);
};

function previewSound(sound){
    var a=document.getElementById("previewAudio");
    a.src=sound.file;
    a.currentTime=0;
    a.play();

    document.getElementById("previewOverlay").style.display="flex";
    document.getElementById("previewName").textContent=sound.name;

    a.onended=closePreview;
}

function closePreview(){
    var a=document.getElementById("previewAudio");
    a.pause(); a.currentTime=0;
    document.getElementById("previewOverlay").style.display="none";
}

document.getElementById("stopPreview").onclick=closePreview;

/* ---------- LAUNDRY ---------- */
var f="Father", mo="Mother", s="Shalyn", l="Lamoni", ja="Jason", je="Jedediah", ma="Marianne", _="****";

var schedule={
mon:[mo,mo,mo,je+" & "+ma],
tue:[s,ma,ma,ja],
wed:[s,je,je,l],
thu:[s,mo,mo,ja],
fri:[s,je,ma,l],
sat:[ja,ja,l,l],
sun:[_,_,_,_]
};

var lastPerson=null;

function drawLaundry(){
    var d=new Date();
    var day=schedule[d.toString().toLowerCase().slice(0,3)];
    var h=d.getHours();

    var slots=[5,10,14,18];
    var idx=-1;
    for(var i=0;i<slots.length;i++){
        if(h>=slots[i] && h<(slots[i+1]||24)){ idx=i; break;}
    }

    var person = idx===-1?_:day[idx];

    document.getElementById("onlaundry").textContent=
        person+" is currently on laundry.";

    if(lastPerson && person!==lastPerson && person!==_ && lastPerson!==_){
        var snd=document.getElementById("turnSound");
        snd.currentTime=0;
        snd.play();
    }
    lastPerson=person;
}

/* ---------- TIMERS ---------- */
var timers=[];
var nextId=1;
var deleteId=null;
var completedId=null;

function save(){ localStorage.setItem("timers",JSON.stringify(timers)); }

function load(){
    var s=localStorage.getItem("timers");
    if(s){
        timers=JSON.parse(s);
        nextId=Math.max(0,...timers.map(t=>t.id))+1;
    }
}

function addTimer(m){
    timers.push({
        id:nextId++,
        minutes:m,
        end:Date.now()+m*60000,
        completed:false,
        sound:selectedSound
    });
    save(); render();
}

function removeTimer(id){
    timers=timers.filter(t=>t.id!==id);
    save(); render();
}

function render(){
    var box=document.getElementById("timers");
    box.innerHTML="";
    if(!timers.length){ box.innerHTML='<div class="empty">No active timers.</div>'; return;}

    timers.forEach(t=>{
        var d=document.createElement("div"); d.className="timer-item";

        var del=document.createElement("button");
        del.className="delete-btn"; del.textContent="✕";
        del.onclick=()=>{ deleteId=t.id; document.getElementById("deleteOverlay").style.display="flex"; };

        var main=document.createElement("div"); main.className="timer-main";

        var name=document.createElement("div");
        name.className="timer-name";
        name.textContent=t.minutes+" min ("+t.sound.name+")";

        var time=document.createElement("div");
        time.className="timer-left";
        var left = t.end - Date.now();

if (left > 0) {
    var totalSeconds = Math.ceil(left / 1000);
    var minutes = Math.floor(totalSeconds / 60);
    var seconds = totalSeconds % 60;

    var display = "";
    if (minutes > 0) display += minutes + "m ";
    display += seconds + "s";

    time.textContent = display;
} else {
    time.textContent = "Finishing...";
}

        main.appendChild(name); main.appendChild(time);
        d.appendChild(del); d.appendChild(main);
        box.appendChild(d);
    });
}

function check(){
    timers.forEach(t=>{
        if(!t.completed && Date.now()>=t.end){
            t.completed=true;
            completedId=t.id;

            var a=document.getElementById("alarmSound");
            a.src=t.sound.file;
            a.currentTime=0;
            a.play().catch(err => {
    console.log("Audio play blocked:", err);
});

            document.getElementById("doneText").textContent=t.minutes+" minute timer done!";
            document.getElementById("doneOverlay").style.display="flex";

            a.onended=function(){
                if(completedId){
                    var tm=timers.find(x=>x.id===completedId);
                    if(tm){
                        tm.completed=false;
                        tm.end=Date.now()+120000;
                    }
                    completedId=null;
                    save(); render();
                }
            };
        }
    });
    render();
}

/* ---------- EVENTS ---------- */
document.getElementById("addTimerBtn").onclick=()=>{
    var v=Number(document.getElementById("minutesInput").value);
    if(v>0){ addTimer(v); }
};

document.getElementById("cancelDelete").onclick=()=>{
    deleteId=null;
    document.getElementById("deleteOverlay").style.display="none";
};

document.getElementById("confirmDelete").onclick=()=>{
    if(deleteId!==null){ removeTimer(deleteId); }
    deleteId=null;
    document.getElementById("deleteOverlay").style.display="none";
};

document.getElementById("dismissDone").onclick=()=>{
    var a=document.getElementById("alarmSound");
    a.pause(); a.currentTime=0; a.onended=null;

    if(completedId){ removeTimer(completedId); completedId=null; }

    document.getElementById("doneOverlay").style.display="none";
};
document.body.addEventListener("click", () => {
    var a = document.getElementById("alarmSound");
    a.play().then(() => {
        a.pause();
        a.currentTime = 0;
    }).catch(()=>{});
}, { once: true });
/* ---------- INIT ---------- */
load();
render();
drawLaundry();
setInterval(drawLaundry,10000);
setInterval(check,500);
</script>

</body>
</html>
